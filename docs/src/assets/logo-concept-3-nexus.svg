<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <linearGradient id="nexusCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>
    <linearGradient id="nexusViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2387" />
      <stop offset="100%" stop-color="#E94057" />
    </linearGradient>
    <linearGradient id="hexPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="56" fill="url(#hexPlate)" stroke="#2D3148" stroke-width="2" />

  <!-- Hexagonal Outer Vault Segment 1 (Top Shield Apex) -->
  <path d="M128 36 L196 74 V120 L166 103 L128 82 L90 103 L60 120 V74 Z"
        fill="url(#nexusFire)"
        filter="url(#neonGlow)" />

  <!-- Hexagonal Outer Vault Segment 2 (Bottom Right) -->
  <path d="M208 136 L208 182 L128 228 L128 192 L162 172 L162 136 Z"
        fill="url(#nexusViolet)" />

  <!-- Hexagonal Outer Vault Segment 3 (Bottom Left) -->
  <path d="M48 136 L94 136 L94 172 L128 192 L128 228 L48 182 Z"
        fill="url(#nexusCyber)" />

  <!-- Central Nexus Core Shield / Lock -->
  <polygon points="128,96 166,118 166,162 128,184 90,162 90,118"
           fill="#0E1017"
           stroke="#FFFFFF"
           stroke-width="4"
           stroke-linejoin="round" />

  <!-- Central Omni Key Matrix -->
  <!-- Lock Arc -->
  <path d="M116 130 V122 C116 115 121 110 128 110 C135 110 140 115 140 122 V130"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="6"
        stroke-linecap="round" />

  <!-- Lock Pad -->
  <rect x="112" y="130" width="32" height="26" rx="6" fill="url(#nexusFire)" />

  <!-- Keyhole -->
  <circle cx="128" cy="140" r="3.5" fill="#0E1017" />
  <polygon points="126,141 130,141 131,149 125,149" fill="#0E1017" />
</svg>
