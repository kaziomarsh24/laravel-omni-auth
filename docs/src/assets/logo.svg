<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="userHexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <!-- Outer & Inner Hex Border Gradient (Red to Purple) -->
    <linearGradient id="userHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Middle Hex Border (Muted Crimson / Wine) -->
    <linearGradient id="userHexMidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B1627" />
      <stop offset="100%" stop-color="#3A173E" />
    </linearGradient>

    <!-- Lock Body Gradient -->
    <linearGradient id="userLockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF386B" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="userGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Base Squircle -->
  <rect width="256" height="256" rx="58" fill="url(#userHexBg)" stroke="#1F2338" stroke-width="2" />

  <!-- 1. Outer Layer Hex Shield -->
  <polygon points="128,24 218,68 218,146 128,232 38,146 38,68"
           fill="none"
           stroke="url(#userHexGrad)"
           stroke-width="5.5"
           stroke-linejoin="round"
           filter="url(#userGlow)" />

  <!-- 2. Middle Layer Hex Shield -->
  <polygon points="128,54 196,86 196,142 128,206 60,142 60,86"
           fill="none"
           stroke="url(#userHexMidGrad)"
           stroke-width="4.5"
           stroke-linejoin="round" />

  <!-- 3. Inner Layer Hex Shield -->
  <polygon points="128,84 176,106 176,142 128,184 80,142 80,106"
           fill="#11131E"
           stroke="url(#userHexGrad)"
           stroke-width="5"
           stroke-linejoin="round" />

  <!-- 4. Central Padlock -->
  <!-- White Shackle -->
  <path d="M112 118 V100 C112 90 119 82 128 82 C137 82 144 90 144 100 V118"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="9"
        stroke-linecap="round" />

  <!-- Rounded Lock Body -->
  <rect x="104" y="116" width="48" height="42" rx="10"
        fill="url(#userLockGrad)" />

  <!-- Classic Keyhole -->
  <circle cx="128" cy="133" r="4.5" fill="#0E1017" />
  <path d="M126.5 134 L125 146 H131 L129.5 134 Z" fill="#0E1017" />
</svg>