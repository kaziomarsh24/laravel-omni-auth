<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D20" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F0F1A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Outer Geometry -->
  <path d="M128 20 
           C188 20 226 44 226 96 
           C226 166 164 218 128 236 
           C92 218 30 166 30 96 
           C30 44 68 20 128 20 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#omniGrad)" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Omni Multi-Client Interlocking Infinity Rings -->
  <!-- Left Loop (Web / Browser) -->
  <path d="M88 128 
           C70 110 70 86 88 68 
           C106 50 130 50 148 68 
           L108 188 
           C90 206 66 206 48 188 
           C30 170 30 146 48 128 Z" 
        fill="none" 
        stroke="url(#omniGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.35" />

  <!-- Central Shield Lock Core -->
  <!-- Upper Shackle -->
  <path d="M104 114 
           V92 
           C104 78 114 68 128 68 
           C142 68 152 78 152 92 
           V114" 
        fill="none" 
        stroke="url(#omniGrad)" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="94" y="114" width="68" height="56" rx="14" 
        fill="url(#omniGrad)" />

  <!-- Keyhole -->
  <circle cx="128" cy="136" r="7" fill="#0F0F1A" />
  <path d="M125 138 L123 154 H133 L131 138 Z" fill="#0F0F1A" />

  <!-- Bottom Dynamic Energy Accents -->
  <circle cx="128" cy="200" r="5" fill="url(#omniGrad)" filter="url(#glow)" />
  <circle cx="106" cy="188" r="3.5" fill="#EC4899" opacity="0.8" />
  <circle cx="150" cy="188" r="3.5" fill="#6366F1" opacity="0.8" />
</svg>
